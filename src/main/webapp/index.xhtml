<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Boutique E-commerce JSF</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 60%; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .btn { padding: 5px 10px; background-color: #28a745; color: white; border: none; cursor: pointer; }
        .btn:hover { background-color: #218838; }
    </style>
</h:head>
<h:body>

    <h1>Bienvenue #{boutiqueBean.moi.nom} !</h1>

    <h2>Vitrine des produits</h2>
    <h:form>
        <h:dataTable value="#{boutiqueBean.vitrine}" var="prod">
            <h:column>
                <f:facet name="header">ID</f:facet>
                #{prod.id}
            </h:column>
            <h:column>
                <f:facet name="header">Produit</f:facet>
                #{prod.nom}
            </h:column>
            <h:column>
                <f:facet name="header">Prix</f:facet>
                #{prod.prix} DH
            </h:column>
            <h:column>
                <f:facet name="header">Action</f:facet>
                <!-- Ce bouton appelle la méthode ajouterAuPanier du Bean -->
                <h:commandButton value="Ajouter" action="#{boutiqueBean.ajouterAuPanier(prod)}" styleClass="btn"/>
            </h:column>
        </h:dataTable>
    </h:form>

    <h2>Votre Panier</h2>
    <!-- Ce tableau affiche les produits liés au panier de l'utilisateur -->
    <h:dataTable value="#{boutiqueBean.monPanier.produits}" var="pPanier">
        <h:column>
            <f:facet name="header">Produit sélectionné</f:facet>
            #{pPanier.nom}
        </h:column>
        <h:column>
            <f:facet name="header">Prix</f:facet>
            #{pPanier.prix} DH
        </h:column>
    </h:dataTable>

</h:body>
</html>
